name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# The superproject's reusable workflows, pinned to one of its commits: this CI changes
# only when that pin is moved.
jobs:
  changes:
    uses: LevitateOS/LevitateOS/.github/workflows/detect-changes.yml@a35e7d5dbf53f5b8dec3186f5a9d08d007b3d570
    with:
      type: bun

  ci:
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    uses: LevitateOS/LevitateOS/.github/workflows/bun-ci.yml@a35e7d5dbf53f5b8dec3186f5a9d08d007b3d570
    with:
      # The site is a member of the superproject's JavaScript workspace: it installs from
      # the root bun.lock, beside docs/content, whose generated index it imports.
      workspace-path: docs/website
      workspace-needs: docs/content
      run-build: true
      upload-dist: true
